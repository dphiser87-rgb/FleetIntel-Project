crons:
  - name: weekly-digest
    description: "Emails each workspace owner a weekly PDF digest of KPIs, anomalies, and pending jobs"
    cron: "0 13 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true

  - name: fleet-health-digest
    description: "Emails each workspace owner a weekly list of at-risk vehicles with top health-score factors"
    cron: "0 14 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/health-digest"
    method: POST
    enabled: true
